[project]
name = "music-analyzer"
version = "0.1.0"
description = "Local audio separation, transcription and score workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "basic-pitch==0.4.0",
    "flask>=3.1,<4",
    "librosa>=0.11,<0.12",
    "mido>=1.3,<2",
    "onnxruntime>=1.20,<2",
    # Basic Pitch pins resampy 0.4.2, which imports pkg_resources.
    "setuptools<82",
    "soundfile>=0.13,<1",
    "verovio>=6,<7",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
separation = ["demucs-infer", "torch==2.8.0", "torchaudio==2.8.0"]

[dependency-groups]
dev = ["pyright", "ruff", "playwright"]

[tool.uv]
package = false
# Basic Pitch uses the bundled ONNX checkpoint on every supported platform.
exclude-dependencies = [
    { package = { name = "basic-pitch" }, dependencies = ["tensorflow", "tensorflow-macos", "coremltools", "tflite-runtime"] },
]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
demucs-infer = { git = "https://github.com/openmirlab/demucs-infer.git", rev = "a8552bb9da29a56018ae2f1828d360cc60830b54" }
torch = { index = "torch-cpu", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "torch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
extend-exclude = [".reference"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["studio", "tests"]
typeCheckingMode = "basic"
